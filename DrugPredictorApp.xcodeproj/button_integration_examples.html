<!-- ============================================================================
     OPTION 3: With loading states and better UX
     ============================================================================ -->

<button id="comprehensive-analyze-btn" 
        onclick="comprehensiveAnalysis()"
        style="width: 100%; padding: 16px 32px; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3); transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;"
        onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 12px rgba(59, 130, 246, 0.4)'"
        onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 6px rgba(59, 130, 246, 0.3)'">
    <span style="font-size: 24px;">🔬</span>
    <span>Analyze & Get ML-Powered Recommendations</span>
</button>

<script>
async function comprehensiveAnalysis() {
    const btn = document.getElementById('comprehensive-analyze-btn');
    
    try {
        // Disable button and show loading
        btn.disabled = true;
        btn.style.opacity = '0.7';
        btn.innerHTML = '<span class="spinner" style="display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite;"></span> Analyzing...';
        
        // Step 1: Sample Size Analysis (if you have an existing function)
        if (typeof predict === 'function') {
            await predict();
        }
        
        // Step 2: Drug Assessment
        await getEnhancedPredictionsIntegrated();
        
    } catch (error) {
        console.error('Analysis error:', error);
        alert('Analysis failed: ' + error.message);
    } finally {
        // Re-enable button
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.innerHTML = '<span style="font-size: 24px;">🔬</span><span>Analyze & Get ML-Powered Recommendations</span>';
    }
}
</script>

<style>
